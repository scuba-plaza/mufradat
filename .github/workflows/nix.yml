name: Nix

on:
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, nix/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .github/workflows/nix.yml]
  pull_request:
    paths: [flake.nix, flake.lock, nix/**, package.json, pnpm-lock.yaml, pnpm-workspace.yaml, .github/workflows/nix.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix build -L
