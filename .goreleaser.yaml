version: 2

project_name: mufradat

before:
  hooks:
    - go run ./cmd/nocomments .
    - ./scripts/completions.sh

builds:
  - id: mufradat
    main: ./cmd/mufradat
    binary: mufradat
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/scuba-plaza/mufradat/internal/version.Version={{ .Version }}
      - -X github.com/scuba-plaza/mufradat/internal/version.Commit={{ .Commit }}
      - -X github.com/scuba-plaza/mufradat/internal/version.Date={{ .Date }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: tarball
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - data/SOURCES.md
      - src: completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
